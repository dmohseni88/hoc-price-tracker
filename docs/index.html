<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hoard Ledger — HOC Foil Price Tracker</title>

<!-- Fonts: Fraunces (display, italic), Cormorant (tracked caps), Newsreader (body italic), JetBrains Mono (numerics) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Cormorant:wght@400;500;600&family=Newsreader:ital,opsz@0,6..72;1,6..72&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0a; --panel:#161514; --panel-2:#1e1c1a;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
  --text:#f2ede2; --dim:#8a8177; --gold:#c9975f;
  --scry:#8fa3ad;   /* Scryfall  — steel  */
  --tcg:#d1596b;    /* TCGplayer — wine   */
  --mp:#8fae6a;     /* Manapool  — moss   */
  --maxw:1180px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:"Newsreader",Georgia,serif; font-size:17px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;color:var(--dim);font-weight:600}
.display{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:600;line-height:1.05}

/* ── Top nav ───────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(11,11,10,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav{max-width:var(--maxw);margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{font-family:"Fraunces",serif;font-style:italic;font-weight:600;font-size:1.15rem;letter-spacing:.01em}
.wordmark small{color:var(--gold)}
.nav-links{display:flex;gap:22px;align-items:center}
.nav-links a{font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.18em;font-size:.8rem;color:var(--dim);font-weight:600;padding-bottom:2px;border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--gold);border-bottom-color:var(--gold)}

main{max-width:var(--maxw);margin:0 auto;padding:36px 24px 90px}
.updated{color:var(--dim);font-size:.8rem;font-family:"Cormorant",serif;letter-spacing:.12em;text-transform:uppercase}

/* ── Source pills / prices ─────────────────────────────── */
.src-scry{color:var(--scry)} .src-tcg{color:var(--tcg)} .src-mp{color:var(--mp)}
.cheapest{font-weight:600;position:relative}
.badge{display:inline-block;font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.14em;font-size:.66rem;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--border-strong)}
.badge.low{color:var(--gold);border-color:var(--gold);background:rgba(201,151,95,.10)}

/* ── Overview ──────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:40px;align-items:center;margin-bottom:46px}
.hero-art{width:100%;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55);border:1px solid var(--border)}
.hero h1{font-size:clamp(2.4rem,5vw,3.6rem);margin:.1em 0 .15em}
.hero .price{font-size:2rem;color:var(--gold)}
.hero .sub{color:var(--dim);font-style:italic;max-width:44ch;margin-top:14px}
.pill-btn{display:inline-block;margin-top:22px;background:var(--gold);color:#1a1207;font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-size:.82rem;padding:11px 22px;border-radius:999px;transition:transform .12s,filter .12s}
.pill-btn:hover{transform:translateY(-1px);filter:brightness(1.06)}

.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:46px}
.stat{background:var(--panel);padding:22px 24px}
.stat .k{font-size:1.9rem;color:var(--text)}
.stat .l{margin-top:4px}

.blurb{font-family:"Newsreader",serif;font-style:italic;font-size:1.25rem;color:var(--text);border-left:2px solid var(--gold);padding:6px 0 6px 22px;margin:0 0 46px;max-width:60ch}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:16px}
.section-title h2{font-family:"Fraunces",serif;font-style:italic;font-weight:600;font-size:1.6rem}

.spread-table{width:100%;border-collapse:collapse;font-size:.95rem}
.spread-table th{text-align:left;font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border)}
.spread-table td{padding:14px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.spread-table tr:hover td{background:var(--panel)}
.spread-table .cname{font-family:"Fraunces",serif;font-style:italic;font-weight:600;font-size:1.05rem}
.spread-table th.num,.spread-table td.num{text-align:right}
.linkout{font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;border-bottom:1px solid currentColor;padding-bottom:1px}

/* ── Grid (All Cards) ──────────────────────────────────── */
.grid-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sortsel{background:var(--panel);color:var(--text);border:1px solid var(--border-strong);border-radius:999px;padding:9px 16px;font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.tile{position:relative;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--border);cursor:pointer;aspect-ratio:63/59;transition:transform .14s,border-color .14s,box-shadow .14s}
.tile:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.tile-badges{position:absolute;top:10px;left:10px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.tile-badges .badge{background:rgba(11,11,10,.72);backdrop-filter:blur(4px)}
/* frosted price panel: blur ramps up toward the bottom via mask */
.overlay{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:2;
  padding:14px 15px 15px;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;
  background:linear-gradient(to top,rgba(43,28,20,.90),rgba(43,28,20,.62) 46%,rgba(43,28,20,0) 100%);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 52%,transparent 100%);
          mask-image:linear-gradient(to top,#000 0%,#000 52%,transparent 100%);
}
.tile-name{font-family:"Fraunces",serif;font-style:italic;font-weight:600;font-size:1.02rem;line-height:1.12;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.tile-prices{display:flex;flex-direction:column;gap:3px}
.tile-prices .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.9rem}
.tile-prices .row .lbl{font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;opacity:.92}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.spark{display:block}

/* ── Detail (Single Card) ──────────────────────────────── */
.detail{max-width:820px;margin:0 auto;text-align:center}
.detail-art{width:min(340px,72vw);border-radius:16px;box-shadow:0 26px 64px rgba(0,0,0,.6);border:1px solid var(--border)}
.detail h1{font-size:clamp(2rem,5vw,3rem);margin:22px 0 6px}
.detail .sub{color:var(--dim);font-style:italic;margin-bottom:26px}
.detail-stats{display:flex;justify-content:center;align-items:stretch;gap:0;margin:0 auto 12px;flex-wrap:wrap}
.detail-stats .cell{padding:6px 30px;text-align:center;border-right:1px solid var(--border)}
.detail-stats .cell:last-child{border-right:none}
.detail-stats .cell .v{font-size:1.5rem}
.detail-stats .cell .n{margin-top:4px}
.detail-stats .cell a:hover .v{text-decoration:underline}
.lowline{color:var(--dim);font-style:italic;margin:16px 0 30px;font-size:1rem}
.lowline b{color:var(--gold);font-style:normal;font-family:"JetBrains Mono",monospace}
.chart-panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 20px 14px}
.chart-wrap{position:relative;height:360px}
.back-link{display:inline-block;margin-bottom:26px;color:var(--dim);font-family:"Cormorant",serif;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;font-weight:600}
.back-link:hover{color:var(--gold)}

/* ── Misc ──────────────────────────────────────────────── */
.notice{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;color:var(--dim);font-style:italic}
.notice.err{border-color:#5c2b2e;color:#ff8a80}
.loading{color:var(--dim);font-style:italic;padding:60px 0;text-align:center}
footer{max-width:var(--maxw);margin:0 auto;padding:0 24px 50px;color:var(--dim);font-size:.8rem;font-family:"Cormorant",serif;letter-spacing:.1em;text-transform:uppercase}
footer a{color:var(--gold)}
@media(max-width:640px){
  .hero{grid-template-columns:1fr;text-align:center}
  .hero-art{max-width:240px;margin:0 auto}
  .statrow{grid-template-columns:1fr}
  .detail-stats .cell{border-right:none;border-bottom:1px solid var(--border)}
  .detail-stats .cell:last-child{border-bottom:none}
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="#/overview" class="wordmark">The Hoard <small>Ledger</small></a>
    <nav class="nav-links">
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/cards" data-route="cards">All Cards</a>
      <a href="#/card" data-route="card">Single Card</a>
    </nav>
  </div>
</header>

<main id="view"><div class="loading">Unlocking the hoard…</div></main>

<footer>
  Foil prices for The Hobbit: Eternal-Legal (HOC) · sources Scryfall · TCGplayer · Manapool ·
  <a href="https://github.com/dmohseni88/hoc-price-tracker" target="_blank" rel="noopener">source on GitHub</a>
</footer>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   CONFIG — edit these if the repo path or marketplace link formats change
   ══════════════════════════════════════════════════════════════════════ */
const RAW = "https://raw.githubusercontent.com/dmohseni88/hoc-price-tracker/main/";
const CARDS_URL = RAW + "cards.json";
const SCRY_URL  = RAW + "price_history.csv";
const TCG_URL   = RAW + "tcgtracking_price_history.csv";
const IMG = (num, version="normal") =>
  `https://api.scryfall.com/cards/hoc/${num}?format=image&version=${version}`;
// Marketplace "link out" URLs. Scryfall uses its exact card page (stored in CSV);
// TCGplayer + Manapool are name-based searches (CSVs don't store product IDs).
const tcgSearch = (name) => `https://www.tcgplayer.com/search/magic/product?q=${encodeURIComponent(name)}&view=grid`;
const mpSearch  = (name) => `https://manapool.com/search?q=${encodeURIComponent(name)}`;

/* ══════════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════════ */
const $ = (sel, el=document) => el.querySelector(sel);
const num = (x) => { const n = parseFloat(x); return Number.isFinite(n) ? n : null; };
const money = (n) => n == null ? "—" : "$" + n.toFixed(2);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const median = (arr) => {
  const s = arr.filter(x=>x!=null).sort((a,b)=>a-b);
  if(!s.length) return null;
  const m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
};
// last non-null value in a {date,v} series
const latest = (series) => { for(let i=series.length-1;i>=0;i--) if(series[i].v!=null) return series[i].v; return null; };

/* ══════════════════════════════════════════════════════════════════════
   DATA LOAD + MODEL
   ══════════════════════════════════════════════════════════════════════ */
let MODEL = null;   // array of card objects
let MAXDATE = "";

async function loadData(){
  const [cardsRes, scryRes, tcgRes] = await Promise.all([
    fetch(CARDS_URL), fetch(SCRY_URL), fetch(TCG_URL)
  ]);
  if(!cardsRes.ok) throw new Error("cards.json "+cardsRes.status);
  const cards = await cardsRes.json();
  const scryText = scryRes.ok ? await scryRes.text() : "";
  const tcgText  = tcgRes.ok  ? await tcgRes.text()  : "";
  const scryRows = Papa.parse(scryText, {header:true, skipEmptyLines:true}).data;
  const tcgRows  = Papa.parse(tcgText,  {header:true, skipEmptyLines:true}).data;
  return buildModel(cards, scryRows, tcgRows);
}

function groupBy(rows, key){
  const m = {};
  for(const r of rows){ const k = String(r[key]); (m[k] || (m[k]=[])).push(r); }
  return m;
}

function buildModel(cards, scryRows, tcgRows){
  const scryByNum = groupBy(scryRows, "collector_number");
  const tcgByNum  = groupBy(tcgRows,  "collector_number");
  let maxDate = "";
  const seen = (d) => { if(d && d > maxDate) maxDate = d; };

  const model = cards.map(card => {
    const n = String(card.collector_number);
    const sRows = (scryByNum[n]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    const tRows = (tcgByNum[n] ||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    sRows.forEach(r=>seen(r.date)); tRows.forEach(r=>seen(r.date));

    const scrySeries = sRows.map(r => ({date:r.date, v:num(r.usd_foil)}));
    const tcgSeries  = tRows.map(r => ({date:r.date, v:num(r.tcg_foil_low)}));
    const mpSeries   = tRows.map(r => ({date:r.date, v:num(r.manapool_foil)}));
    const scryUri = sRows.length ? sRows[sRows.length-1].scryfall_uri : "";

    // per-source current price (latest known value)
    const cur = { scry:latest(scrySeries), tcg:latest(tcgSeries), mp:latest(mpSeries) };
    const present = ["scry","tcg","mp"].filter(k => cur[k]!=null);
    const curVals = present.map(k=>cur[k]);
    const buyNow = curVals.length ? Math.min(...curVals) : null;   // cheapest to buy today
    const marketVal = curVals.length ? Math.max(...curVals) : null; // headline "worth"
    const cheapest = present.length ? present.reduce((a,b)=>cur[a]<=cur[b]?a:b) : null;
    const spreadPct = (present.length===3 && buyNow>0) ? (marketVal-buyNow)/buyNow*100 : null;

    // "best buy price" series = min across sources per date (for low tracking + sparkline)
    const dates = [...new Set([...scrySeries, ...tcgSeries, ...mpSeries].map(p=>p.date))].sort();
    const valAt = (series,d)=>{ const hit=series.find(p=>p.date===d); return hit?hit.v:null; };
    const bestSeries = dates.map(d => {
      const vals = [valAt(scrySeries,d),valAt(tcgSeries,d),valAt(mpSeries,d)].filter(v=>v!=null);
      return {date:d, v: vals.length?Math.min(...vals):null};
    }).filter(p=>p.v!=null);

    // all-time low + distance
    let allTimeLow=null, lowDate=null;
    for(const p of bestSeries) if(allTimeLow==null || p.v<allTimeLow){ allTimeLow=p.v; lowDate=p.date; }
    const distPct = (buyNow!=null && allTimeLow!=null && allTimeLow>0) ? (buyNow-allTimeLow)/allTimeLow*100 : null;
    const isNewLow = (buyNow!=null && allTimeLow!=null && buyNow <= allTimeLow + 1e-9);

    // 7-day drop of the best-buy series
    let drop7=null;
    if(bestSeries.length){
      const todayV = bestSeries[bestSeries.length-1].v;
      const todayD = new Date(bestSeries[bestSeries.length-1].date);
      let past=null;
      for(let i=bestSeries.length-1;i>=0;i--){
        const d=new Date(bestSeries[i].date);
        if((todayD-d)/86400000 >= 7){ past=bestSeries[i].v; break; }
      }
      if(past==null && bestSeries.length>1) past=bestSeries[0].v;
      if(past!=null && past>0) drop7 = (todayV-past)/past*100;
    }

    return {
      num:n, name:card.name, img:IMG(n), imgLarge:IMG(n,"large"),
      cur, buyNow, marketVal, cheapest, spreadPct,
      scrySeries, tcgSeries, mpSeries, bestSeries,
      allTimeLow, lowDate, distPct, isNewLow, drop7,
      links:{ scry:scryUri||("https://scryfall.com/card/hoc/"+n), tcg:tcgSearch(card.name), mp:mpSearch(card.name) }
    };
  });
  MAXDATE = maxDate;
  return model;
}

/* ══════════════════════════════════════════════════════════════════════
   SPARKLINE (inline SVG of the best-buy series)
   ══════════════════════════════════════════════════════════════════════ */
function sparkline(series, w=92, h=24){
  const vals = series.map(p=>p.v);
  if(vals.length<2) return `<svg class="spark" width="${w}" height="${h}"></svg>`;
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const x=i=> (i/(vals.length-1))*(w-2)+1;
  const y=v=> h-2 - ((v-min)/span)*(h-4);
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const li = vals.indexOf(min);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline fill="none" stroke="var(--gold)" stroke-width="1.4" points="${pts}"/>
    <circle cx="${x(li).toFixed(1)}" cy="${y(min).toFixed(1)}" r="2.2" fill="var(--gold)"/>
  </svg>`;
}

/* ══════════════════════════════════════════════════════════════════════
   VIEWS
   ══════════════════════════════════════════════════════════════════════ */
const view = () => $("#view");
let chart = null;
function destroyChart(){ if(chart){ chart.destroy(); chart=null; } }

function priceLink(card, key){
  const cls = {scry:"src-scry",tcg:"src-tcg",mp:"src-mp"}[key];
  const url = card.links[key];
  const val = money(card.cur[key]);
  const bold = card.cheapest===key ? " cheapest" : "";
  return `<a class="mono ${cls}${bold}" href="${esc(url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${val}</a>`;
}

/* ---- Overview ---- */
function renderOverview(){
  destroyChart();
  const priced = MODEL.filter(c=>c.marketVal!=null);
  const top = priced.reduce((a,b)=>a.marketVal>=b.marketVal?a:b, priced[0]);
  const med = median(MODEL.map(c=>c.cur.scry));
  const spreads = MODEL.filter(c=>c.spreadPct!=null).sort((a,b)=>b.spreadPct-a.spreadPct).slice(0,5);

  const spreadRows = spreads.map(c=>`
    <tr>
      <td><a href="#/card/${c.num}" class="cname">${esc(c.name)}</a></td>
      <td class="num">${priceLink(c,"scry")}</td>
      <td class="num">${priceLink(c,"tcg")}</td>
      <td class="num">${priceLink(c,"mp")}</td>
      <td class="num mono" style="color:var(--gold)">${c.spreadPct.toFixed(0)}%</td>
    </tr>`).join("");

  view().innerHTML = `
    <div class="updated" style="margin-bottom:26px">Ledger updated ${esc(MAXDATE||"—")}</div>
    <section class="hero">
      <img class="hero-art" src="${top.imgLarge}" alt="${esc(top.name)}" loading="eager">
      <div>
        <div class="eyebrow">Crown of the hoard · dearest card</div>
        <h1 class="display">${esc(top.name)}</h1>
        <div class="price mono">${money(top.marketVal)}</div>
        <div class="sub">Its steepest asking price across the three houses today.
          The rest of the hoard is charted below — watch for the gold marks where a card has fallen to its lowest.</div>
        <a class="pill-btn" href="#/cards">Browse all cards</a>
      </div>
    </section>

    <section class="statrow">
      <div class="stat"><div class="k mono">${money(top.marketVal)}</div><div class="l eyebrow">Top price</div></div>
      <div class="stat"><div class="k mono">${MODEL.length}</div><div class="l eyebrow">Cards tracked</div></div>
      <div class="stat"><div class="k mono">${money(med)}</div><div class="l eyebrow">Median foil (Scryfall)</div></div>
    </section>

    <p class="blurb">“The best time to buy is when the market forgets what a thing is worth.”
      These forty foils are watched daily so you needn't wonder.</p>

    <div class="section-title"><h2>Widest spreads</h2><span class="eyebrow">where the three houses disagree most</span></div>
    <table class="spread-table">
      <thead><tr>
        <th>Card</th>
        <th class="num src-scry">Scryfall</th>
        <th class="num src-tcg">TCGplayer</th>
        <th class="num src-mp">Manapool</th>
        <th class="num">Spread</th>
      </tr></thead>
      <tbody>${spreadRows || `<tr><td colspan="5" style="color:var(--dim)">Not enough data yet.</td></tr>`}</tbody>
    </table>`;
}

/* ---- Grid ---- */
const SORTS = {
  low:   {label:"Closest to low",  fn:(a,b)=>(a.distPct??1e9)-(b.distPct??1e9)},
  drop:  {label:"Biggest 7d drop", fn:(a,b)=>(a.drop7??1e9)-(b.drop7??1e9)},
  price: {label:"Highest price",   fn:(a,b)=>(b.marketVal??-1)-(a.marketVal??-1)},
  name:  {label:"Name (A–Z)",      fn:(a,b)=>a.name.localeCompare(b.name)},
};
let currentSort = "low";

function tileHTML(c){
  const badges = [];
  if(c.isNewLow) badges.push(`<span class="badge low">New low</span>`);
  else if(c.distPct!=null && c.distPct<=5) badges.push(`<span class="badge low">Near low</span>`);
  if(c.drop7!=null && c.drop7<=-3) badges.push(`<span class="badge">▼ ${Math.abs(c.drop7).toFixed(0)}%</span>`);

  const row = (key,label)=>`<div class="row"><span class="lbl ${{scry:'src-scry',tcg:'src-tcg',mp:'src-mp'}[key]}">${label}</span>${priceLink(c,key)}</div>`;
  const dist = c.distPct==null ? "" :
    `<span class="mono" style="color:${c.distPct<=5?'var(--gold)':'var(--dim)'};font-size:.72rem">+${c.distPct.toFixed(0)}% vs low</span>`;

  return `<article class="tile" onclick="location.hash='#/card/${c.num}'">
    <img src="${c.img}" alt="${esc(c.name)}" loading="lazy">
    <div class="tile-badges">${badges.join("")}</div>
    <div class="overlay">
      <div class="tile-name">${esc(c.name)}</div>
      <div class="tile-prices">
        ${row("scry","Scry")}${row("tcg","TCG")}${row("mp","MP")}
      </div>
      <div class="tile-foot">${dist}${sparkline(c.bestSeries)}</div>
    </div>
  </article>`;
}

function renderGrid(){
  destroyChart();
  const cards = MODEL.slice().sort(SORTS[currentSort].fn);
  const opts = Object.entries(SORTS).map(([k,v])=>
    `<option value="${k}"${k===currentSort?" selected":""}>${v.label}</option>`).join("");
  view().innerHTML = `
    <div class="grid-controls">
      <div><div class="eyebrow">All cards</div><h2 class="display" style="font-size:1.7rem;margin-top:2px">The full hoard</h2></div>
      <label class="eyebrow" style="display:flex;align-items:center;gap:10px">Sort by
        <select class="sortsel" id="sortsel">${opts}</select>
      </label>
    </div>
    <div class="grid">${cards.map(tileHTML).join("")}</div>`;
  $("#sortsel").addEventListener("change", e=>{ currentSort=e.target.value; renderGrid(); });
}

/* ---- Detail ---- */
function renderCardPicker(){
  destroyChart();
  const opts = MODEL.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(c=>`<a href="#/card/${c.num}" style="display:block;padding:12px 14px;border-bottom:1px solid var(--border)">
      <span class="cname" style="font-family:'Fraunces';font-style:italic">${esc(c.name)}</span>
      <span class="mono" style="float:right;color:var(--gold)">${money(c.buyNow)}</span></a>`).join("");
  view().innerHTML = `<div class="section-title"><h2>Choose a card</h2></div>
    <div class="notice" style="padding:0">${opts}</div>`;
}

function renderDetail(numStr){
  destroyChart();
  const c = MODEL.find(x=>x.num===String(numStr));
  if(!c){ renderCardPicker(); return; }

  const cell = (key,label)=>`<div class="cell">
      <a href="${esc(c.links[key])}" target="_blank" rel="noopener">
        <div class="v mono ${{scry:'src-scry',tcg:'src-tcg',mp:'src-mp'}[key]}${c.cheapest===key?' cheapest':''}">${money(c.cur[key])}</div>
        <div class="n eyebrow">${label}</div>
      </a></div>`;

  const lowTxt = c.allTimeLow==null ? "" :
    `<div class="lowline">All-time low <b>${money(c.allTimeLow)}</b> on ${esc(c.lowDate)} ·
      ${c.isNewLow ? `<span style="color:var(--gold)">at its lowest right now</span>`
        : `currently <b>+${(c.distPct??0).toFixed(0)}%</b> above that`}</div>`;

  view().innerHTML = `
    <a class="back-link" href="#/cards">← Back to all cards</a>
    <div class="detail">
      <img class="detail-art" src="${c.imgLarge}" alt="${esc(c.name)}">
      <h1 class="display">${esc(c.name)}</h1>
      <div class="sub">Collector #${c.num} · The Hobbit: Eternal-Legal</div>
      <div class="detail-stats">${cell("scry","Scryfall")}${cell("tcg","TCGplayer")}${cell("mp","Manapool")}</div>
      ${lowTxt}
      <div class="chart-panel">
        <div class="eyebrow" style="text-align:left;margin-bottom:10px">Foil price history</div>
        <div class="chart-wrap"><canvas id="hchart"></canvas></div>
      </div>
    </div>`;

  drawChart(c);
}

function drawChart(c){
  const labels = [...new Set([...c.scrySeries,...c.tcgSeries,...c.mpSeries].map(p=>p.date))].sort();
  const align = (series)=> labels.map(d=>{ const h=series.find(p=>p.date===d); return h?h.v:null; });

  // gold marker at the single lowest datapoint across all sources
  const lowMarker = labels.map(()=>null);
  if(c.lowDate){ const idx=labels.indexOf(c.lowDate); if(idx>=0) lowMarker[idx]=c.allTimeLow; }

  const mk = (label,data,color)=>({
    label, data, borderColor:color, backgroundColor:color,
    borderWidth:2, pointRadius:2.5, pointHoverRadius:5, tension:.25, spanGaps:true
  });
  destroyChart();
  chart = new Chart($("#hchart"), {
    type:"line",
    data:{ labels, datasets:[
      mk("Scryfall",  align(c.scrySeries), "#8fa3ad"),
      mk("TCGplayer", align(c.tcgSeries),  "#d1596b"),
      mk("Manapool",  align(c.mpSeries),   "#8fae6a"),
      { label:"All-time low", data:lowMarker, borderColor:"#c9975f", backgroundColor:"#c9975f",
        pointRadius:7, pointHoverRadius:8, showLine:false, pointStyle:"circle" }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, interaction:{mode:"index",intersect:false},
      plugins:{
        legend:{ labels:{ color:"#8a8177", font:{family:"'JetBrains Mono'",size:11}, usePointStyle:true, boxWidth:8 } },
        tooltip:{ callbacks:{ label:(ctx)=> ctx.parsed.y==null?null:` ${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}` } }
      },
      scales:{
        x:{ grid:{color:"rgba(255,255,255,0.05)"}, ticks:{color:"#8a8177", font:{family:"'JetBrains Mono'",size:10}, maxRotation:0, autoSkipPadding:16} },
        y:{ grid:{color:"rgba(255,255,255,0.05)"}, ticks:{color:"#8a8177", font:{family:"'JetBrains Mono'",size:10}, callback:v=>"$"+v} }
      }
    }
  });
}

/* ══════════════════════════════════════════════════════════════════════
   ROUTER
   ══════════════════════════════════════════════════════════════════════ */
function setActive(route){
  document.querySelectorAll(".nav-links a").forEach(a=>
    a.classList.toggle("active", a.dataset.route===route));
}
function route(){
  if(!MODEL) return;
  const hash = location.hash.replace(/^#\/?/,"");
  const [seg, id] = hash.split("/");
  if(seg==="cards"){ setActive("cards"); renderGrid(); }
  else if(seg==="card"){ setActive("card"); id ? renderDetail(id) : renderCardPicker(); }
  else { setActive("overview"); renderOverview(); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ══════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════ */
(async function(){
  try{
    MODEL = await loadData();
    if(!location.hash) location.hash = "#/overview";
    route();
  }catch(err){
    view().innerHTML = `<div class="notice err">Couldn't load price data — ${esc(err.message)}.
      <br>Check that the repo is public and the CSVs exist at raw.githubusercontent.com.</div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>

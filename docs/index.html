<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Gate</title>
<meta name="description" content="Magic: The Gathering price tracking and buy-list price comparison across TCGplayer, Manapool and Card Kingdom.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b4bff'/%3E%3Cpath d='M10 24V13a6 6 0 0 1 12 0v11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Fonts: Geist (UI + display), Geist Mono (numbers) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Libraries: PapaParse (CSV) + Chart.js (history chart), from cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root{
  --bg:#f6f6f9; --panel:#ffffff; --panel-2:#f1f1f6;
  --border:#e7e7ee; --border-strong:#d7d7e2;
  --text:#15151c; --dim:#6b6b7d; --faint:#9a9aab;
  --accent:#5b4bff; --accent-soft:#eeebff; --accent-ink:#3d2fd6;
  --bad:#d92d20;
  --scry:#5f6f86;   /* Scryfall  — slate  */
  --tcg:#d93a5b;    /* TCGplayer — rose   */
  --mp:#1f9a5c;     /* Manapool  — green  */
  --ck:#a347c9;     /* Card Kingdom — orchid */
  --shadow-sm:0 1px 2px rgba(20,20,40,.05);
  --shadow:0 1px 2px rgba(20,20,40,.04),0 8px 24px -12px rgba(20,20,40,.14);
  --shadow-lg:0 2px 4px rgba(20,20,40,.04),0 24px 48px -20px rgba(20,20,40,.22);
  --radius:16px;
  --maxw:1200px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:420px;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 100% at 15% 0%,rgba(91,75,255,.10),transparent 70%),radial-gradient(50% 90% at 90% 0%,rgba(217,58,91,.06),transparent 70%)}
a{color:inherit;text-decoration:none}
button{font:inherit}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;color:var(--dim);font-weight:600}
.display{font-weight:650;letter-spacing:-.035em;line-height:1.05}

/* ── Top nav ───────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(246,246,249,.78);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--border);
}
.nav{max-width:var(--maxw);margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{display:flex;align-items:center;gap:10px;font-weight:650;font-size:1.08rem;letter-spacing:-.02em}
.wordmark .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7a5cff,#5b4bff 55%,#3d2fd6);display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(91,75,255,.6)}
.wordmark .mark svg{width:16px;height:16px}
.nav-links{display:flex;gap:2px;align-items:center;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:3px}
.nav-links a{font-size:.86rem;font-weight:500;color:var(--dim);padding:6px 14px;border-radius:999px;transition:color .15s,background .15s,box-shadow .15s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--text);background:var(--panel);box-shadow:var(--shadow-sm),0 0 0 1px var(--border)}

main{max-width:var(--maxw);margin:0 auto;padding:36px 24px 90px}
.updated{color:var(--dim);font-size:.8rem;font-weight:500}

/* ── Source pills / prices ─────────────────────────────── */
.src-scry{color:var(--scry)} .src-tcg{color:var(--tcg)} .src-mp{color:var(--mp)}
.cheapest{font-weight:600;background:var(--accent-soft);color:var(--accent-ink) !important;border-radius:6px;padding:1px 6px}
.badge{display:inline-block;text-transform:uppercase;letter-spacing:.06em;font-size:.64rem;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--border-strong);background:var(--panel);color:var(--dim)}
.badge.low{color:var(--accent-ink);border-color:transparent;background:var(--accent-soft)}

/* ── Overview ──────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:48px;align-items:center;margin-bottom:40px;
  background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.hero-art{width:100%;border-radius:14px;box-shadow:var(--shadow-lg)}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.4rem);margin:.2em 0 .2em}
.hero .price{font-size:1.9rem;font-weight:600;color:var(--accent)}
.hero .sub{color:var(--dim);max-width:46ch;margin-top:12px}
.pill-btn{display:inline-block;margin-top:22px;background:var(--text);color:#fff;font-weight:600;font-size:.88rem;padding:10px 20px;border-radius:999px;border:none;cursor:pointer;transition:transform .12s,background .12s}
.pill-btn:hover{transform:translateY(-1px);background:var(--accent)}

.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:40px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm)}
.stat .k{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.stat .l{margin-top:4px}

.blurb{font-size:1.05rem;color:var(--dim);border-left:3px solid var(--accent);padding:4px 0 4px 18px;margin:0 0 40px;max-width:62ch}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.section-title h2{font-weight:650;letter-spacing:-.03em;font-size:1.55rem}

.spread-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.spread-table th{text-align:left;text-transform:uppercase;letter-spacing:.06em;font-size:.68rem;color:var(--dim);font-weight:600;padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.spread-table td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.spread-table tbody tr:last-child > td{border-bottom:none}
.spread-table tr:hover td{background:#fafafd}
.spread-table .cname{font-weight:600;letter-spacing:-.01em}
.spread-table th.num,.spread-table td.num{text-align:right}
.linkout{font-size:.75rem;border-bottom:1px solid currentColor;padding-bottom:1px}

/* ── Grid (All Cards) ──────────────────────────────────── */
.grid-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sortsel{background:var(--panel);color:var(--text);border:1px solid var(--border-strong);border-radius:999px;padding:8px 14px;font:inherit;font-size:.86rem;font-weight:500;cursor:pointer;box-shadow:var(--shadow-sm);text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.tile{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--panel);border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:transform .14s,border-color .14s,box-shadow .14s}
.tile:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow-lg)}
.tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 18%;background:var(--panel-2)}
.tile-badges{position:absolute;top:10px;left:10px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.tile-badges .badge{box-shadow:var(--shadow-sm)}
.overlay{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tile-name{font-weight:600;font-size:.96rem;line-height:1.2;letter-spacing:-.01em}
.tile-prices{display:flex;flex-direction:column;gap:2px}
.tile-prices .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.86rem}
.tile-prices .row .lbl{text-transform:uppercase;letter-spacing:.06em;font-size:.64rem;font-weight:600}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;border-top:1px solid var(--border)}
.spark{display:block}

/* ── Detail (Single Card) ──────────────────────────────── */
.detail{max-width:860px;margin:0 auto;text-align:center}
.detail-art{width:min(320px,72vw);border-radius:16px;box-shadow:var(--shadow-lg)}
.detail h1{font-size:clamp(1.9rem,4.6vw,2.8rem);margin:22px 0 6px}
.detail .sub{color:var(--dim);margin-bottom:24px}
.detail-stats{display:inline-flex;justify-content:center;align-items:stretch;margin:0 auto 12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.detail-stats .cell{padding:14px 30px;text-align:center;border-right:1px solid var(--border)}
.detail-stats .cell:last-child{border-right:none}
.detail-stats .cell .v{font-size:1.4rem;font-weight:600}
.detail-stats .cell .n{margin-top:4px}
.detail-stats .cell a:hover .v{text-decoration:underline}
.lowline{color:var(--dim);margin:16px 0 28px;font-size:.92rem}
.lowline b{color:var(--accent-ink);font-family:"Geist Mono",monospace;font-weight:600}
.chart-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 20px 14px;box-shadow:var(--shadow)}
.chart-wrap{position:relative;height:360px}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:22px;color:var(--dim);font-size:.86rem;font-weight:500}
.back-link:hover{color:var(--accent)}

/* ── Buy List ──────────────────────────────────────────── */
.buy-input{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:28px;box-shadow:var(--shadow)}
.buy-input textarea{width:100%;min-height:180px;resize:vertical;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px;font-family:"Geist Mono",monospace;font-size:.86rem;line-height:1.6;transition:border-color .15s,box-shadow .15s,background .15s}
.buy-input textarea::placeholder{color:var(--faint)}
.buy-input textarea:focus{outline:none;background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.buy-controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:14px}
.buy-controls .pill-btn{margin-top:0;margin-left:auto}
.chk{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:.9rem;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.ghost-btn{background:var(--panel);border:1px solid var(--border-strong);color:var(--text);border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:500;cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .15s,color .15s}
.ghost-btn:hover{color:var(--accent);border-color:var(--accent)}
.table-scroll{overflow-x:auto;border-radius:var(--radius)}
.buy-table td{padding:10px 14px}
.buy-table .thumb{width:34px;border-radius:4px;display:block;box-shadow:var(--shadow-sm)}
.buy-table .cardcell{display:flex;align-items:center;gap:12px;min-width:230px}
.buy-table .print{color:var(--dim);font-size:.74rem;font-family:"Geist Mono",monospace}
.buy-table .sub-p{display:block;color:var(--faint);font-size:.7rem}
.buy-table .best{font-weight:600;background:var(--accent-soft);color:var(--accent-ink) !important;border-radius:6px;padding:1px 6px}
.buy-table td.best{background:none;padding:10px 14px}
.buy-table .ck{color:var(--ck)}
.buy-table .eur{color:var(--dim)}
.buy-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 22px}
.buy-summary .stat{padding:16px 18px}
.buy-summary .stat .k{font-size:1.4rem}
.buy-summary .stat .m{color:var(--dim);font-size:.78rem;margin-top:2px}
.buy-summary .stat.win{background:linear-gradient(135deg,#6b55ff,#4b3cf0);border-color:transparent;box-shadow:0 12px 28px -14px rgba(91,75,255,.7)}
.buy-summary .stat.win .k,.buy-summary .stat.win .l,.buy-summary .stat.win .m{color:#fff}
.buy-summary .stat.win .m{opacity:.82}
.muted{color:var(--faint)}
.err-text{color:var(--bad)}
.prints-toggle{background:var(--accent-soft);border:none;color:var(--accent-ink);font-family:"Geist Mono",monospace;font-size:.68rem;font-weight:500;cursor:pointer;padding:2px 8px;margin-left:6px;border-radius:999px}
.prints-toggle:hover{background:#e2dcff}
.buy-table .prints-row > td{background:var(--panel-2);padding:4px 14px 16px}
.buy-table .prints-row:hover > td{background:var(--panel-2)}
.prints-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.prints-table{box-shadow:none}
.prints-table td{padding:7px 12px}
.prints-table tr.pinned td{background:var(--accent-soft)}
.prints-table .thumb{width:26px}
.prints-table .cardcell{min-width:200px;gap:10px}
.prints-table .pset{font-size:.88rem;line-height:1.2;font-weight:500}
.prints-table .ghost-btn{padding:4px 12px}

/* ── Misc ──────────────────────────────────────────────── */
.notice{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;color:var(--dim);box-shadow:var(--shadow-sm)}
.notice.err{border-color:#f5c2bd;background:#fff6f5;color:var(--bad)}
.picker a{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text)}
.picker a:last-child{border-bottom:none}
.picker a:hover{background:var(--panel-2)}
.loading{color:var(--dim);padding:60px 0;text-align:center}
footer{max-width:var(--maxw);margin:0 auto;padding:24px 24px 50px;color:var(--faint);font-size:.8rem;border-top:1px solid var(--border)}
footer a{color:var(--accent)}
@media(max-width:640px){
  .hero{grid-template-columns:1fr;text-align:center;padding:22px;gap:24px}
  .hero-art{max-width:220px;margin:0 auto}
  .statrow{grid-template-columns:1fr}
  .detail-stats{display:flex}
  .detail-stats .cell{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--border)}
  .detail-stats .cell:last-child{border-bottom:none}
  .nav{flex-wrap:wrap;padding:10px 16px}
  .nav-links{width:100%;justify-content:space-between;overflow-x:auto}
  .nav-links a{padding:6px 10px;font-size:.82rem;white-space:nowrap}
  main{padding:24px 16px 70px}
  .buy-controls .pill-btn{margin-left:0;width:100%;text-align:center}
}
</style>
</head>

<header>

      <a href="#/buy" data-route="buy">Buy List</a>
    </nav>
  </div>
</header>

<main id="view"><div class="loading">Loading prices…</div></main>

<footer>
  Magic Gate · HOC foil tracking and buy-list pricing · data from Scryfall, TCGplayer, Manapool &amp; Card Kingdom ·
  <a href="https://github.com/dmohseni88/hoc-price-tracker" target="_blank" rel="noopener">source on GitHub</a>
</footer>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   CONFIG — edit these if the repo path or marketplace link formats change
   ══════════════════════════════════════════════════════════════════════ */
const RAW = "https://raw.githubusercontent.com/dmohseni88/hoc-price-tracker/main/";
const CARDS_URL = RAW + "cards.json";
const SCRY_URL  = RAW + "price_history.csv";
const TCG_URL   = RAW + "tcgtracking_price_history.csv";
const IMG = (num, version="normal") =>
  `https://api.scryfall.com/cards/hoc/${num}?format=image&version=${version}`;
// Marketplace "link out" URLs. Scryfall uses its exact card page (stored in CSV);
// TCGplayer + Manapool are name-based searches (CSVs don't store product IDs).
const tcgSearch = (name) => `https://www.tcgplayer.com/search/magic/product?q=${encodeURIComponent(name)}&view=grid`;
const mpSearch  = (name) => `https://manapool.com/search?q=${encodeURIComponent(name)}`;

/* ══════════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════════ */
const $ = (sel, el=document) => el.querySelector(sel);
const num = (x) => { const n = parseFloat(x); return Number.isFinite(n) ? n : null; };
const money = (n) => n == null ? "—" : "$" + n.toFixed(2);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const median = (arr) => {
  const s = arr.filter(x=>x!=null).sort((a,b)=>a-b);
  if(!s.length) return null;
  const m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
};
// last non-null value in a {date,v} series
const latest = (series) => { for(let i=series.length-1;i>=0;i--) if(series[i].v!=null) return series[i].v; return null; };

/* ══════════════════════════════════════════════════════════════════════
   DATA LOAD + MODEL
   ══════════════════════════════════════════════════════════════════════ */
let MODEL = null;   // array of card objects
let MAXDATE = "";

async function loadData(){
  const [cardsRes, scryRes, tcgRes] = await Promise.all([
    fetch(CARDS_URL), fetch(SCRY_URL), fetch(TCG_URL)
  ]);
  if(!cardsRes.ok) throw new Error("cards.json "+cardsRes.status);
  const cards = await cardsRes.json();
  const scryText = scryRes.ok ? await scryRes.text() : "";
  const tcgText  = tcgRes.ok  ? await tcgRes.text()  : "";
  const scryRows = Papa.parse(scryText, {header:true, skipEmptyLines:true}).data;
  const tcgRows  = Papa.parse(tcgText,  {header:true, skipEmptyLines:true}).data;
  return buildModel(cards, scryRows, tcgRows);
}

function groupBy(rows, key){
  const m = {};
  for(const r of rows){ const k = String(r[key]); (m[k] || (m[k]=[])).push(r); }
  return m;
}

function buildModel(cards, scryRows, tcgRows){
  const scryByNum = groupBy(scryRows, "collector_number");
  const tcgByNum  = groupBy(tcgRows,  "collector_number");
  let maxDate = "";
  const seen = (d) => { if(d && d > maxDate) maxDate = d; };

  const model = cards.map(card => {
    const n = String(card.collector_number);
    const sRows = (scryByNum[n]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    const tRows = (tcgByNum[n] ||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    sRows.forEach(r=>seen(r.date)); tRows.forEach(r=>seen(r.date));

    const scrySeries = sRows.map(r => ({date:r.date, v:num(r.usd_foil)}));
    const tcgSeries  = tRows.map(r => ({date:r.date, v:num(r.tcg_foil_low)}));
    const mpSeries   = tRows.map(r => ({date:r.date, v:num(r.manapool_foil)}));
    const scryUri = sRows.length ? sRows[sRows.length-1].scryfall_uri : "";

    // per-source current price (latest known value)
    const cur = { scry:latest(scrySeries), tcg:latest(tcgSeries), mp:latest(mpSeries) };
    const present = ["scry","tcg","mp"].filter(k => cur[k]!=null);
    const curVals = present.map(k=>cur[k]);
    const buyNow = curVals.length ? Math.min(...curVals) : null;   // cheapest to buy today
    const marketVal = curVals.length ? Math.max(...curVals) : null; // headline "worth"
    const cheapest = present.length ? present.reduce((a,b)=>cur[a]<=cur[b]?a:b) : null;
    const spreadPct = (present.length===3 && buyNow>0) ? (marketVal-buyNow)/buyNow*100 : null;

    // "best buy price" series = min across sources per date (for low tracking + sparkline)
    const dates = [...new Set([...scrySeries, ...tcgSeries, ...mpSeries].map(p=>p.date))].sort();
    const valAt = (series,d)=>{ const hit=series.find(p=>p.date===d); return hit?hit.v:null; };
    const bestSeries = dates.map(d => {
      const vals = [valAt(scrySeries,d),valAt(tcgSeries,d),valAt(mpSeries,d)].filter(v=>v!=null);
      return {date:d, v: vals.length?Math.min(...vals):null};
    }).filter(p=>p.v!=null);

    // all-time low + distance
    let allTimeLow=null, lowDate=null;
    for(const p of bestSeries) if(allTimeLow==null || p.v<allTimeLow){ allTimeLow=p.v; lowDate=p.date; }
    const distPct = (buyNow!=null && allTimeLow!=null && allTimeLow>0) ? (buyNow-allTimeLow)/allTimeLow*100 : null;
    const isNewLow = (buyNow!=null && allTimeLow!=null && buyNow <= allTimeLow + 1e-9);

    // 7-day drop of the best-buy series
    let drop7=null;
    if(bestSeries.length){
      const todayV = bestSeries[bestSeries.length-1].v;
      const todayD = new Date(bestSeries[bestSeries.length-1].date);
      let past=null;
      for(let i=bestSeries.length-1;i>=0;i--){
        const d=new Date(bestSeries[i].date);
        if((todayD-d)/86400000 >= 7){ past=bestSeries[i].v; break; }
      }
      if(past==null && bestSeries.length>1) past=bestSeries[0].v;
      if(past!=null && past>0) drop7 = (todayV-past)/past*100;
    }

    return {
      num:n, name:card.name, img:IMG(n), imgLarge:IMG(n,"large"),
      cur, buyNow, marketVal, cheapest, spreadPct,
      scrySeries, tcgSeries, mpSeries, bestSeries,
      allTimeLow, lowDate, distPct, isNewLow, drop7,
      links:{ scry:scryUri||("https://scryfall.com/card/hoc/"+n), tcg:tcgSearch(card.name), mp:mpSearch(card.name) }
    };
  });
  MAXDATE = maxDate;
  return model;
}

/* ══════════════════════════════════════════════════════════════════════
   SPARKLINE (inline SVG of the best-buy series)
   ══════════════════════════════════════════════════════════════════════ */
function sparkline(series, w=92, h=24){
  const vals = series.map(p=>p.v);
  if(vals.length<2) return `<svg class="spark" width="${w}" height="${h}"></svg>`;
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const x=i=> (i/(vals.length-1))*(w-2)+1;
  const y=v=> h-2 - ((v-min)/span)*(h-4);
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const li = vals.indexOf(min);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline fill="none" stroke="var(--accent)" stroke-width="1.4" points="${pts}"/>
    <circle cx="${x(li).toFixed(1)}" cy="${y(min).toFixed(1)}" r="2.2" fill="var(--accent)"/>
  </svg>`;
}

/* ══════════════════════════════════════════════════════════════════════
   BUY LIST — paste any cards, compare TCGplayer / Manapool / Card Kingdom
   Scryfall finds the printings; TCGTracking supplies TCGplayer + Manapool;
   Card Kingdom comes from the trimmed index the daily workflow builds.
   ══════════════════════════════════════════════════════════════════════ */
const SCRY_API = "https://api.scryfall.com";
const TT_API   = "https://tcgtracking.com/tcgapi/v1";
const CK_URL   = "https://raw.githubusercontent.com/dmohseni88/hoc-price-tracker/ck-data/ck_prices.json";
const BUY_KEY  = "hoard.buylist";
const SITES = {
  tcg:{label:"TCGplayer",    cls:"src-tcg"},
  mp: {label:"Manapool",     cls:"src-mp"},
  ck: {label:"Card Kingdom", cls:"ck"},
};
let ckPromise = null;     // Card Kingdom index, loaded on first lookup
let ckInfo = null;
const ttSetCache = {};    // TCGplayer group id -> set pricing promise
let buyRows = [];
let buyRun = 0;           // bumps on each lookup so stale results are dropped

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
};

// Scryfall asks for ~10 requests/sec max, so every call goes through one gate.
let scryGate = Promise.resolve();
function scryFetch(path){
  const p = scryGate.then(()=>fetch(SCRY_API+path, {headers:{Accept:"application/json"}}));
  const pause = ()=>new Promise(r=>setTimeout(r,110));
  scryGate = p.then(pause, pause);
  return p.then(r => r.ok ? r.json() : r.status===404 ? null : Promise.reject(new Error("Scryfall "+r.status)));
}
const getJSON = (url) => fetch(url).then(r=>r.ok?r.json():null).catch(()=>null);

function loadCK(){
  if(!ckPromise) ckPromise = getJSON(CK_URL).then(d => { ckInfo = d; return d; });
  return ckPromise;
}

// Accepts "4 Lightning Bolt", "4x Lightning Bolt", "1 Sol Ring (CMM) 400 *F*", "Sol Ring", etc.
function parseList(text){
  const out = [];
  for(const raw of text.split(/\r?\n/)){
    let s = raw.trim();
    if(!s || /^(\/\/|#)/.test(s) || /^(deck|sideboard|commander|companion|maybeboard|mainboard)\s*:?$/i.test(s)) continue;
    let foil = false;
    s = s.replace(/\s*(\*F\*|\*E\*|\((foil|etched)\)|\[(foil|etched)\])\s*$/i, ()=>{ foil = true; return ""; });
    const q = s.match(/^(\d+)\s*x?\s+(.+)$/i);
    const qty = q ? parseInt(q[1],10) : 1;
    if(q) s = q[2];
    let set = null, cn = null;
    const sm = s.match(/^(.*?)\s*[([]([A-Za-z0-9]{2,6})[)\]]\s*([A-Za-z0-9★-]+)?\s*$/);
    if(sm && sm[1]){ s = sm[1]; set = sm[2].toLowerCase(); cn = sm[3] || null; }
    if(s) out.push({qty, name:s.trim(), set, cn, foil});
  }
  return out;
}

// Returns every paper printing of the card, plus the exact printing if the line named one.
async function findPrintings(item, anyPrint){
  // skip gold-bordered World Championship decks, oversized cards, etc. — not real copies to buy
  const search = (q) => scryFetch(`/cards/search?unique=prints&q=${encodeURIComponent(q+" game:paper -st:memorabilia -is:oversized")}`);
  const oracleOf = (c) => c && (c.oracle_id || (c.card_faces||[])[0]?.oracle_id);
  if(item.set && !anyPrint){
    const c = item.cn ? await scryFetch(`/cards/${item.set}/${encodeURIComponent(item.cn)}`)
                      : await scryFetch(`/cards/named?exact=${encodeURIComponent(item.name)}&set=${item.set}`);
    if(c){
      const res = oracleOf(c) ? await search(`oracleid:${oracleOf(c)}`) : null;
      const prints = res ? res.data : [];
      if(!prints.some(p=>p.id===c.id)) prints.unshift(c);
      return {prints, exact:c};
    }
  }
  let res = await search(`!"${item.name.replace(/"/g,"")}"`);
  if(!res){
    // typo or partial name — let Scryfall's fuzzy match pick the card, then get its printings
    const named = await scryFetch(`/cards/named?fuzzy=${encodeURIComponent(item.name)}`);
    if(oracleOf(named)) res = await search(`oracleid:${oracleOf(named)}`);
  }
  let prints = res ? res.data : [];
  // `!"Lightning Bolt"` also matches cards with Lightning Bolt as a back face — prefer the card itself
  const want = item.name.toLowerCase();
  const same = prints.filter(c => c.name.toLowerCase()===want || c.name.toLowerCase().split(" // ")[0]===want);
  if(same.length) prints = same;
  return {prints, exact:null};
}

const hasFinish = (c, foil) => (c.finishes||[]).some(f => foil ? (f==="foil"||f==="etched") : f==="nonfoil");
const scryPrice = (c, foil) => foil ? (num(c.prices.usd_foil) ?? num(c.prices.usd_etched)) : num(c.prices.usd);
const printLabel = (c) => `${c.set.toUpperCase()} #${c.collector_number}`;
const cardImg = (c) => (c.image_uris || (c.card_faces||[])[0]?.image_uris || {}).small || "";

function pickTcgVariant(tcg, foil){
  const k = Object.keys(tcg||{}).find(k => foil ? (/foil/i.test(k) && !/non/i.test(k)) : /^normal$/i.test(k));
  return k ? tcg[k] : null;
}

// TCGplayer low/market + Manapool for one TCGplayer product.
// The product endpoint gives the set id; the set pricing endpoint is fresher, so prefer it.
async function ttPrices(tcgId, foil){
  const prod = await getJSON(`${TT_API}/products/${tcgId}`);
  if(!prod || !prod.product) return null;
  const gid = prod.product.group_id;
  const setP = ttSetCache[gid] || (ttSetCache[gid] = getJSON(`${TT_API}/1/sets/${gid}/pricing`));
  const entry = ((await setP)||{}).prices?.[String(tcgId)] || {};
  const prodMp = prod.prices?.manapool || {};
  let tcg = pickTcgVariant(entry.tcg, foil);
  if(!tcg){
    const p = (prod.prices?.tcgplayer||[]).find(p => foil ? /foil/i.test(p.sub_type_name) : /^normal$/i.test(p.sub_type_name));
    if(p) tcg = {low:p.low_price, market:p.market_price};
  }
  const mp = num(entry.manapool?.[foil?"foil":"normal"]) ??
             num(foil ? (prodMp.fo_nm ?? prodMp.fo_low) : (prodMp.nf_nm ?? prodMp.nf_low));
  return {
    tcgLow: tcg ? num(tcg.low) : null, tcgMkt: tcg ? num(tcg.market) : null, mp,
    tcgUrl: prod.product.url || null, mpUrl: prodMp.manapool_url || null,
  };
}

// Everything the printings dropdown needs about one printing. `tt` (TCGplayer + Manapool)
// is filled in lazily — undefined means not fetched yet, null means TCGTracking had nothing.
function printInfo(c, foil, ck){
  const e = ck && ck.cards[c.id.replace(/-/g,"").slice(0,12)];
  return {
    id:c.id, label:printLabel(c), setName:c.set_name, img:cardImg(c), scryUrl:c.scryfall_uri,
    tcgplayerId:c.tcgplayer_id || null, usd:scryPrice(c, foil),
    tcgUrl:c.purchase_uris?.tcgplayer || null,
    eur:num(c.prices[foil?"eur_foil":"eur"]), cmUrl:c.purchase_uris?.cardmarket || "",
    ck: e ? {r:e[foil?4:1], b:e[foil?5:2], url:ck.base_url + (e[foil?3:0] || e[0] || e[3])} : null,
    tt: undefined,
  };
}

function loadTT(p, foil){
  if(p.tt !== undefined || !p.tcgplayerId) return Promise.resolve(p.tt ?? null);
  if(!p.ttP) p.ttP = ttPrices(p.tcgplayerId, foil).catch(()=>null).then(t => (p.tt = t));
  return p.ttP;
}

async function priceItem(item, opts){
  const foil = item.foil || opts.foil;
  const row = {...item, foil, status:"ok", sites:{}, ckBuy:null, eur:null, img:"", scryUrl:"",
               prints:[], pinId:null, pinMiss:false, open:false};
  const found = await findPrintings(item, opts.anyPrint);
  if(!found.prints.length){ row.status = "Not found on Scryfall"; return row; }
  row.name = (found.exact || found.prints[0]).name;
  const ck = await loadCK();
  // cheapest-looking printings first (by Scryfall's TCGplayer market price)
  row.prints = found.prints.filter(c => hasFinish(c, foil))
    .sort((a,b)=>(scryPrice(a,foil)??1e9)-(scryPrice(b,foil)??1e9))
    .map(c => printInfo(c, foil, ck));
  if(!row.prints.length){ row.status = foil ? "No foil printing" : "Only exists in foil"; return row; }
  if(found.exact){
    if(hasFinish(found.exact, foil)) row.pinId = found.exact.id;
    else row.pinMiss = true;
  }else if(item.set && !opts.anyPrint) row.pinMiss = true;
  await priceRow(row);
  return row;
}

// Fills the row's per-site prices from its pinned printing, or from all printings if none is pinned.
async function priceRow(row){
  const foil = row.foil;
  const use = row.pinId ? row.prints.filter(p=>p.id===row.pinId) : row.prints;
  row.sites = {}; row.ckBuy = null; row.eur = null; row.status = "ok";
  row.img = use[0].img;
  row.scryUrl = use[0].scryUrl;

  // Card Kingdom — cheapest in-stock printing. Buylist is for that same printing
  // (or the lowest offer across printings), so it reflects the copy you'd actually own.
  let ckBuyPick = null, minBuy = null;
  for(const p of use){
    if(!p.ck) continue;
    const {r, b, url} = p.ck;
    if(r!=null && (!row.sites.ck || r<row.sites.ck.p)){
      row.sites.ck = {p:r, url, print:p.label};
      ckBuyPick = b!=null ? {p:b, url, print:p.label} : null;
    }
    if(b!=null && (!minBuy || b<minBuy.p)) minBuy = {p:b, url, print:p.label};
  }
  row.ckBuy = ckBuyPick || minBuy;

  // Cardmarket € — reference only, not part of the USD totals
  for(const p of use)
    if(p.eur!=null && (!row.eur || p.eur<row.eur.p)) row.eur = {p:p.eur, url:p.cmUrl, print:p.label};

  // TCGplayer + Manapool — check the two cheapest printings (all of them once the dropdown has loaded them)
  const cands = use.filter(p=>p.tcgplayerId).slice(0,2);
  await Promise.all(cands.map(p => loadTT(p, foil)));
  for(const p of use){
    const t = p.tt;
    if(!t) continue;
    // market price, not the lowest listing — "low" is often one damaged or foreign copy
    const tp = t.tcgMkt ?? t.tcgLow;
    if(tp!=null && (!row.sites.tcg || tp<row.sites.tcg.p))
      row.sites.tcg = {p:tp, low:t.tcgLow, url:t.tcgUrl || tcgSearch(row.name), print:p.label};
    if(t.mp!=null && (!row.sites.mp || t.mp<row.sites.mp.p))
      row.sites.mp = {p:t.mp, url:t.mpUrl || mpSearch(row.name), print:p.label};
  }
  // TCGTracking had nothing — fall back to Scryfall's copy of the TCGplayer market price
  if(!row.sites.tcg){
    const p = use.find(p=>p.usd!=null);
    if(p) row.sites.tcg = {p:p.usd, low:null, url:p.tcgUrl || tcgSearch(row.name), print:p.label};
  }
  if(!Object.keys(row.sites).length) row.status = "No prices listed";
}

// Opening the dropdown fetches TCGplayer + Manapool for every printing (capped, cheapest first).
const PRINTS_SHOWN = 40;
async function openPrints(row){
  const todo = row.prints.slice(0, PRINTS_SHOWN).filter(p => p.tt===undefined && p.tcgplayerId);
  let next = 0;
  const worker = async () => {
    while(next < todo.length){
      await loadTT(todo[next++], row.foil);
      if(!buyRows.includes(row)) return;
      renderBuyResults();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if(!buyRows.includes(row)) return;
  await priceRow(row);   // a printing further down may turn out cheaper on TCGplayer / Manapool
  renderBuyResults();
}

const bestSite = (row) => {
  const ks = Object.keys(row.sites);
  return ks.length ? ks.reduce((a,b)=>row.sites[a].p<=row.sites[b].p?a:b) : null;
};

function buySummary(rows){
  const done = rows.filter(r=>r.status==="ok");
  const per = {};
  for(const k of Object.keys(SITES)){
    let total=0, missing=0;
    for(const r of done){ if(r.sites[k]) total += r.qty*r.sites[k].p; else missing += r.qty; }
    per[k] = {total, missing};
  }
  let mix=0; const mixBy={};
  for(const r of done){
    const k = bestSite(r); if(!k) continue;
    mix += r.qty*r.sites[k].p;
    (mixBy[k] || (mixBy[k]={n:0,total:0})).n += r.qty;
    mixBy[k].total += r.qty*r.sites[k].p;
  }
  const buylist = done.reduce((s,r)=>s + (r.ckBuy ? r.qty*r.ckBuy.p : 0), 0);
  return {per, mix, mixBy, buylist};
}

function siteCell(row, k){
  const s = row.sites[k];
  if(!s) return `<td class="num muted">—</td>`;
  const best = bestSite(row)===k ? " best" : "";
  const mkt = (k==="tcg" && s.low!=null && s.low<s.p) ? `<span class="sub-p">low ${money(s.low)}</span>` : "";
  return `<td class="num"><a class="mono ${SITES[k].cls}${best}" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.print)}">${money(s.p)}</a>${mkt}</td>`;
}

function printsHTML(r, i){
  const shown = r.prints.slice(0, PRINTS_SHOWN);
  // once TCGTracking has answered, trust it over Scryfall's copy (Scryfall shows stray prices on rare printings)
  const tcgOf = (p) => p.tt ? (p.tt.tcgMkt ?? p.tt.tcgLow) : p.usd;
  const lowest = (f) => { const v = shown.map(f).filter(x=>x!=null); return v.length ? Math.min(...v) : null; };
  const low = {tcg:lowest(tcgOf), mp:lowest(p=>p.tt?.mp), ck:lowest(p=>p.ck?.r)};
  const cell = (v, url, cls, isLow) => v==null ? `<td class="num muted">—</td>` :
    `<td class="num"><a class="mono ${cls}${isLow?" best":""}" href="${esc(url)}" target="_blank" rel="noopener">${money(v)}</a></td>`;

  const rows = shown.map(p => {
    const tcg = tcgOf(p);
    const mp = p.tt===undefined && p.tcgplayerId ? `<td class="num muted">…</td>`
      : cell(p.tt?.mp, p.tt?.mpUrl || mpSearch(r.name), "src-mp", p.tt?.mp!=null && p.tt.mp===low.mp);
    const pinned = r.pinId===p.id;
    return `<tr class="${pinned?"pinned":""}">
      <td><div class="cardcell">
        <a href="${esc(p.scryUrl)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(p.img)}" alt="" loading="lazy"></a>
        <div><div class="pset">${esc(p.setName)}</div><div class="print">${esc(p.label)}</div></div></div></td>
      ${cell(tcg, p.tt?.tcgUrl || p.tcgUrl || tcgSearch(r.name), "src-tcg", tcg!=null && tcg===low.tcg)}
      ${mp}
      ${cell(p.ck?.r, p.ck?.url, "ck", p.ck?.r!=null && p.ck.r===low.ck)}
      <td class="num">${p.ck?.b!=null ? `<a class="mono ck" href="${esc(p.ck.url)}" target="_blank" rel="noopener">${money(p.ck.b)}</a>` : `<span class="muted">—</span>`}</td>
      <td class="num">${p.eur!=null ? `<a class="mono eur" href="${esc(p.cmUrl)}" target="_blank" rel="noopener">€${p.eur.toFixed(2)}</a>` : `<span class="muted">—</span>`}</td>
      <td class="num">${pinned ? `<span class="badge low">Using</span>`
        : `<button class="ghost-btn" data-act="pin" data-i="${i}" data-id="${esc(p.id)}">Use</button>`}</td>
    </tr>`;
  }).join("");

  const more = r.prints.length > shown.length ? ` · showing the ${shown.length} cheapest of ${r.prints.length}` : "";
  return `<tr class="prints-row"><td></td><td colspan="8">
    <div class="prints-head">
      <span class="eyebrow">${r.prints.length} printing${r.prints.length>1?"s":""}${more}</span>
      ${r.pinId ? `<button class="ghost-btn" data-act="unpin" data-i="${i}">Use cheapest printing</button>` : ""}
    </div>
    <div class="table-scroll"><table class="spread-table prints-table">
      <thead><tr><th>Printing</th><th class="num src-tcg">TCGplayer</th><th class="num src-mp">Manapool</th>
        <th class="num ck">Card Kingdom</th><th class="num">CK buys at</th><th class="num">Cardmarket</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </td></tr>`;
}

function buyRowHTML(r, i){
  const pending = r.status==="pending";
  const k = pending ? null : bestSite(r);
  const pin = r.pinId && r.prints.find(p=>p.id===r.pinId);
  const where = pin ? pin.label : (r.pinMiss ? "any printing (that printing not found)" : "any printing");
  const toggle = r.prints && r.prints.length
    ? `<button class="prints-toggle" data-act="toggle" data-i="${i}" aria-expanded="${r.open}">${r.prints.length} printing${r.prints.length>1?"s":""} ${r.open?"▴":"▾"}</button>` : "";
  const card = `<div class="cardcell">
      ${r.img ? `<a href="${esc(r.scryUrl)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(r.img)}" alt="" loading="lazy"></a>` : `<span style="width:34px"></span>`}
      <div><div class="cname">${esc(r.name)}${r.foil?` <span class="badge low">Foil</span>`:""}</div>
      <div class="print">${esc(where)} ${toggle}</div></div></div>`;
  if(pending) return `<tr><td class="num mono">${r.qty}</td><td>${card}</td><td colspan="7" class="muted"><i>Looking up…</i></td></tr>`;
  if(r.status!=="ok") return `<tr><td class="num mono">${r.qty}</td><td>${card}</td><td colspan="7" class="err-text"><i>${esc(r.status)}</i></td></tr>`;
  const ckBuy = r.ckBuy ? `<a class="mono ck" href="${esc(r.ckBuy.url)}" target="_blank" rel="noopener" title="${esc(r.ckBuy.print)}">${money(r.ckBuy.p)}</a>` : "—";
  const eur = r.eur ? `<a class="mono eur" href="${esc(r.eur.url)}" target="_blank" rel="noopener" title="${esc(r.eur.print)}">€${r.eur.p.toFixed(2)}</a>` : "—";
  return `<tr>
    <td class="num mono">${r.qty}</td><td>${card}</td>
    ${siteCell(r,"tcg")}${siteCell(r,"mp")}${siteCell(r,"ck")}
    <td class="eyebrow ${k?SITES[k].cls:""}">${k?SITES[k].label:"—"}</td>
    <td class="num mono best">${k?money(r.qty*r.sites[k].p):"—"}</td>
    <td class="num muted">${ckBuy}</td><td class="num">${eur}</td>
  </tr>${r.open ? printsHTML(r, i) : ""}`;
}

function renderBuyResults(){
  const out = $("#buyOut");
  if(!out) return;
  if(!buyRows.length){ out.innerHTML = ""; return; }
  const sum = buySummary(buyRows);
  const pending = buyRows.filter(r=>r.status==="pending").length;
  const failed = buyRows.filter(r=>r.status!=="ok" && r.status!=="pending").length;
  const cards = buyRows.reduce((s,r)=>s+r.qty,0);

  const siteStats = Object.entries(SITES).map(([k,s])=>`
    <div class="stat"><div class="k mono ${s.cls}">${money(sum.per[k].total)}</div>
      <div class="l eyebrow">All from ${s.label}</div>
      <div class="m">${sum.per[k].missing ? `${sum.per[k].missing} card${sum.per[k].missing>1?"s":""} not listed` : "every card listed"}</div></div>`).join("");
  const mixNote = Object.entries(sum.mixBy).map(([k,v])=>`${v.n} from ${SITES[k].label}`).join(" · ");

  const ckNote = ckInfo ? `Card Kingdom prices as of ${esc(ckInfo.updated)}`
    : (ckPromise ? `Card Kingdom data isn't available yet — it's built by the daily workflow` : "");

  out.innerHTML = `
    <div class="grid-controls" style="margin-bottom:14px">
      <div class="updated">${pending ? `Pricing ${cards} cards… ${buyRows.length-pending} of ${buyRows.length} lines done` :
        `${cards} cards · ${buyRows.length} lines${failed?` · ${failed} not priced`:""}`}</div>
      <button class="ghost-btn" id="buyCopy" data-act="copy">Copy results</button>
    </div>
    <section class="buy-summary">
      <div class="stat win"><div class="k mono">${money(sum.mix)}</div><div class="l eyebrow">Cheapest mix</div><div class="m">${esc(mixNote||"—")}</div></div>
      ${siteStats}
      <div class="stat"><div class="k mono ck">${money(sum.buylist)}</div><div class="l eyebrow">CK buylist</div><div class="m">what Card Kingdom would pay</div></div>
    </section>
    <div class="table-scroll"><table class="spread-table buy-table">
      <thead><tr>
        <th class="num">Qty</th><th>Card</th>
        <th class="num src-tcg">TCGplayer</th><th class="num src-mp">Manapool</th><th class="num ck">Card Kingdom</th>
        <th>Best</th><th class="num">Line total</th><th class="num">CK buys at</th><th class="num">Cardmarket</th>
      </tr></thead>
      <tbody>${buyRows.map(buyRowHTML).join("")}</tbody>
    </table></div>
    <p class="lowline" style="margin-top:18px">TCGplayer market price (cheapest listing beneath, any condition) · Manapool near-mint ·
      Card Kingdom near-mint in stock · hover a price to see which printing it's for, or open a card's printings to compare them all
      and pick one. ${ckNote}</p>`;
}

// One listener on the results area handles the dropdown toggles, Use buttons and Copy.
async function onBuyClick(e){
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const act = btn.dataset.act;
  if(act==="copy"){ copyBuyResults(); return; }
  const row = buyRows[+btn.dataset.i];
  if(!row) return;
  if(act==="toggle"){
    row.open = !row.open;
    renderBuyResults();
    if(row.open) openPrints(row);
  }else if(act==="pin" || act==="unpin"){
    row.pinId = act==="pin" ? btn.dataset.id : null;
    row.pinMiss = false;
    await priceRow(row);
    renderBuyResults();
  }
}

function copyBuyResults(){
  const lines = buyRows.map(r=>{
    const k = r.status==="ok" ? bestSite(r) : null;
    if(!k) return `${r.qty}x ${r.name} — ${r.status==="ok"?"no price":r.status}`;
    const s = r.sites[k];
    return `${r.qty}x ${r.name}${r.foil?" (foil)":""} — ${money(s.p)} @ ${SITES[k].label} (${s.print}) = ${money(r.qty*s.p)}`;
  });
  const sum = buySummary(buyRows);
  lines.push("", `Cheapest mix: ${money(sum.mix)}`,
    ...Object.entries(SITES).map(([k,s])=>`All from ${s.label}: ${money(sum.per[k].total)}${sum.per[k].missing?` (${sum.per[k].missing} missing)`:""}`));
  const btn = $("#buyCopy");
  navigator.clipboard.writeText(lines.join("\n"))
    .then(()=>{ btn.textContent = "Copied"; setTimeout(()=>{ btn.textContent = "Copy results"; }, 1500); })
    .catch(()=>{ btn.textContent = "Copy failed"; });
}

async function runBuyLookup(){
  const text = $("#buytext").value;
  store.set(BUY_KEY, text);
  const opts = {foil:$("#optFoil").checked, anyPrint:$("#optAny").checked};
  store.set(BUY_KEY+".opts", JSON.stringify(opts));
  const items = parseList(text);
  const run = ++buyRun;
  buyRows = items.map(it => ({...it, status:"pending", sites:{}, foil:it.foil||opts.foil}));
  renderBuyResults();
  loadCK();

  let next = 0;
  const worker = async () => {
    while(next < items.length){
      const i = next++;
      let row;
      try{ row = await priceItem(items[i], opts); }
      catch(e){ row = {...buyRows[i], status:"Lookup failed — "+e.message}; }
      if(run !== buyRun) return;
      buyRows[i] = row;
      renderBuyResults();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

function renderBuy(){
  destroyChart();
  let opts = {};
  try{ opts = JSON.parse(store.get(BUY_KEY+".opts") || "{}"); }catch(e){}
  view().innerHTML = `
    <div class="section-title"><h2>Buy list</h2><span class="eyebrow">paste cards · compare TCGplayer, Manapool & Card Kingdom</span></div>
    <div class="buy-input">
      <textarea id="buytext" spellcheck="false" placeholder="1 Sol Ring&#10;4x Lightning Bolt&#10;1 Rhystic Study (PCY) 45 *F*&#10;Smothering Tithe"></textarea>
      <div class="buy-controls">
        <label class="chk"><input type="checkbox" id="optFoil"${opts.foil?" checked":""}> Price everything as foil</label>
        <label class="chk"><input type="checkbox" id="optAny"${opts.anyPrint?" checked":""}> Ignore set codes, find the cheapest printing</label>
        <button class="pill-btn" id="buyGo">Price it</button>
      </div>
    </div>
    <div id="buyOut"></div>`;
  $("#buytext").value = store.get(BUY_KEY) || "";
  $("#buyGo").addEventListener("click", runBuyLookup);
  $("#buyOut").addEventListener("click", onBuyClick);
  $("#buytext").addEventListener("keydown", e => { if(e.key==="Enter" && (e.ctrlKey||e.metaKey)) runBuyLookup(); });
  renderBuyResults();
}

/* ══════════════════════════════════════════════════════════════════════
   ROUTER
   ══════════════════════════════════════════════════════════════════════ */
function setActive(route){
  document.querySelectorAll(".nav-links a").forEach(a=>
    a.classList.toggle("active", a.dataset.route===route));
}
function route(){
  const hash = location.hash.replace(/^#\/?/,"");
  const [seg, id] = hash.split("/");
  // Buy List doesn't need the HOC history, so it works even if that failed to load
  if(seg==="buy"){ setActive("buy"); renderBuy(); window.scrollTo(0,0); return; }
  if(!MODEL) return;
  if(seg==="cards"){ setActive("cards"); renderGrid(); }
  else if(seg==="card"){ setActive("card"); id ? renderDetail(id) : renderCardPicker(); }
  else { setActive("overview"); renderOverview(); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ══════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════ */
(async function(){
  try{
    MODEL = await loadData();
    if(!location.hash) location.hash = "#/overview";
    route();
  }catch(err){
    if(location.hash.startsWith("#/buy")){ route(); return; }
    view().innerHTML = `<div class="notice err">Couldn't load price data — ${esc(err.message)}.
      <br>Check that the repo is public and the CSVs exist at raw.githubusercontent.com.</div>`;
    console.error(err);
  }
})();
</script>
